<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #F4F8FB">
    <div
      data-pencil-id="BTo68"
      data-pencil-name="13 · 目的地独立补图 / 操作状态"
      style="align-items: flex-start; background-color: #F4F8FB; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; height: 420px; justify-content: flex-start; padding: 24px; width: 1140px"
    >
      <div
        data-pencil-id="iX0oB"
        data-pencil-name="补图设计标题"
        style='box-sizing: border-box; color: #1E3443; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 24px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
      >
        目的地图片 · 保留文字，独立更新
      </div>
      <div
        data-pencil-id="I1LxvR"
        data-pencil-name="交互说明"
        style='box-sizing: border-box; color: #516774; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
      >

      </div>
      <div

      >
        <div

          data-pencil-name="未保存图片"
          style="align-items: flex-start; background-color: #FFFFFF; border-radius: 12px; box-sizing: border-box; display: flex; flex-direction: column; flex: 1 1 0; gap: 12px; height: 240px; justify-content: flex-start; padding: 16px"
        >
          <div
            data-pencil-id="l7DEA"
            data-pencil-name="未保存图片标题"
            style='box-sizing: border-box; color: #1E3443; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'

            未保存图片
          </div>
          <div
            data-pencil-id="aO9K7"
            data-pencil-name="未保存图片提示"
            style='box-sizing: border-box; color: #516774; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%'
          >
            还没有保存图片
          </div>
          <div
            data-pencil-id="kXe1M"
            data-pencil-name="补充图片 · 48dp"
            style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: 48px; justify-content: flex-start; width: 100%"

            <div

          <div

            style='box-sizing: border-box; color: #516774; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%'
          >

          </div>
        </div>
        <div

          >
            正在读取直隶总督署的图片…
          </div>
          <div
            data-pencil-id="I8Uvli"
            data-pencil-name="取消补图 · 48dp"
            style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: 48px; justify-content: flex-start; width: 100%"
          >
            <div
              data-pencil-id="HDStM"
              data-pencil-name="取消补图标签"
              style='box-sizing: border-box; color: #0073AA; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'

          <div

            style='box-sizing: border-box; color: #516774; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%'
          >

          </div>
        </div>
        <div

          data-pencil-name="图片下载失败"

          <div

          <div
            data-pencil-id="Q9Cjh"
            data-pencil-name="图片下载失败说明"
            style='box-sizing: border-box; color: #516774; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%'
          >
            保留文字介绍；备用搜索会使用 Tavily 额度。
          </div>
        </div>
